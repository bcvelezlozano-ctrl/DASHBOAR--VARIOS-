<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People · Rocas & KPIs Q2 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0E0F; --ink2:#4A4A54; --ink3:#9B9BA8; --ink4:#C8C8D4;
  --bg:#F7F7FA; --surface:#FFFFFF; --raised:#FAFAFD;
  --accent:#5B4CFF; --accent-light:#EEECff; --accent-mid:#7B6FFF;
  --green:#16A34A; --green-light:#DCFCE7;
  --amber:#D97706; --amber-light:#FEF3C7;
  --red:#DC2626; --red-light:#FEE2E2;
  --blue:#1D6DB5; --blue-light:#DBEAFE;
  --border:#EBEBF0; --border2:#D4D4DF;
  --r:12px; --r-sm:8px; --r-xs:5px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;}
code,pre{font-family:'JetBrains Mono',monospace;}

/* ─── HEADER ─── */
.hdr{background:var(--ink);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.hdr-icon svg{width:20px;height:20px;fill:#fff;}
.hdr-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:-0.02em;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.45);margin-top:1px;}
.hdr-right{display:flex;gap:8px;align-items:center;}
.hpill{font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:0.04em;}
.hpill-accent{background:rgba(91,76,255,0.25);color:#A99FFF;}
.hpill-gray{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);}

/* ─── PROGRESS BAR HEADER ─── */
.progress-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.prog-item{display:flex;align-items:center;gap:8px;}
.prog-dot{width:10px;height:10px;border-radius:50%;}
.prog-lbl{font-size:11px;color:var(--ink2);font-weight:500;}
.prog-bar-wrap{flex:1;min-width:200px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}

/* ─── MAIN ─── */
.main{max-width:1340px;margin:0 auto;padding:28px 28px 60px;}

/* ─── ROCK CARD ─── */
.rock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s;}
.rock-card:hover{box-shadow:var(--shadow-lg);}

.rock-header{padding:18px 22px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;user-select:none;}
.rock-motor{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--r-xs);background:var(--accent-light);color:var(--accent);letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.rock-num{font-size:11px;font-weight:700;color:var(--ink3);background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-xs);padding:3px 8px;flex-shrink:0;}
.rock-info{flex:1;}
.rock-title{font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-0.01em;margin-bottom:4px;}
.rock-desc{font-size:12px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rock-desc.expanded{display:block;}
.rock-meta{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--r-xs);letter-spacing:0.03em;}
.tag-hab{background:var(--blue-light);color:var(--blue);}
.rock-chevron{width:24px;height:24px;flex-shrink:0;color:var(--ink3);transition:transform .25s;}
.rock-chevron.open{transform:rotate(180deg);}

/* ─── ROCK BODY ─── */
.rock-body{border-top:1px solid var(--border);display:none;}
.rock-body.open{display:block;}

/* ─── KPI ROWS ─── */
.kpi-row{border-bottom:1px solid var(--bg);padding:16px 22px;}
.kpi-row:last-child{border-bottom:none;}
.kpi-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;align-items:start;margin-bottom:10px;}
.kpi-text-wrap{}
.kpi-label{font-size:12px;font-weight:600;line-height:1.45;margin-bottom:3px;}
.kpi-meta{font-size:11px;color:var(--ink2);}
.kpi-meta strong{color:var(--ink);}
.period-col{display:flex;flex-direction:column;gap:4px;}
.period-title{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:4px 9px;border-radius:var(--r-xs);white-space:nowrap;}
.st-conseguido{background:var(--green-light);color:var(--green);}
.st-proceso{background:var(--amber-light);color:var(--amber);}
.st-iniciar{background:var(--bg);color:var(--ink3);border:1px solid var(--border2);}
.st-no{background:var(--red-light);color:var(--red);}
.st-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.entregable{font-size:10px;color:var(--ink2);margin-top:3px;line-height:1.5;}

/* ─── PROGRESS BAR ─── */
.kpi-progress{margin-top:8px;}
.kpi-prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.kpi-prog-label{font-size:10px;font-weight:600;color:var(--ink2);}
.kpi-prog-pct{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.prog-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;cursor:pointer;position:relative;}
.prog-track input[type=range]{position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;}
.prog-fill{height:100%;border-radius:4px;transition:width .3s ease;pointer-events:none;}

/* ─── COMMENTS SECTION ─── */
.comments-section{background:var(--raised);border-top:1px solid var(--border);padding:16px 22px;}
.comments-title{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.comments-title span{background:var(--accent);color:#fff;border-radius:10px;font-size:9px;padding:1px 6px;}
.comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.comment-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;}
.comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.comment-author{font-size:11px;font-weight:600;color:var(--accent);}
.comment-date{font-size:10px;color:var(--ink3);}
.comment-text{font-size:12px;line-height:1.6;color:var(--ink2);}
.comment-month{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--accent-light);color:var(--accent);margin-bottom:4px;}
.comment-input-row{display:flex;gap:8px;align-items:flex-end;}
.comment-input{flex:1;font-size:12px;padding:8px 12px;border:1.5px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:'Sora',sans-serif;resize:none;min-height:40px;transition:border-color .15s;}
.comment-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,76,255,0.08);}
.comment-month-sel{font-size:11px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:'Sora',sans-serif;cursor:pointer;}
.comment-month-sel:focus{outline:none;border-color:var(--accent);}
.btn-comment{font-size:12px;font-weight:600;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-family:'Sora',sans-serif;white-space:nowrap;transition:background .15s;}
.btn-comment:hover{background:var(--accent-mid);}
.btn-del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;transition:color .15s;}
.btn-del:hover{color:var(--red);}

/* ─── FILE SECTION ─── */
.files-section{border-top:1px solid var(--border);padding:14px 22px;background:var(--raised);}
.files-title{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.file-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xs);padding:6px 10px;font-size:11px;}
.file-chip-icon{font-size:14px;}
.file-chip-name{font-weight:500;color:var(--ink);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-chip-date{font-size:9px;color:var(--ink3);}
.btn-file-del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:11px;padding:0 2px;transition:color .15s;}
.btn-file-del:hover{color:var(--red);}
.file-upload-row{display:flex;align-items:center;gap:8px;}
.btn-upload{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:8px 14px;background:var(--surface);border:1.5px dashed var(--border2);border-radius:var(--r-sm);color:var(--ink2);cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s;}
.btn-upload:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.file-input{display:none;}
.file-note{font-size:10px;color:var(--ink3);}

/* ─── OVERALL PROGRESS SECTION ─── */
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px;}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);}
.ov-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.ov-val{font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1;}
.ov-sub{font-size:11px;color:var(--ink2);margin-top:4px;}

/* ─── SECTION DIVIDER ─── */
.section-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.08em;margin:24px 0 12px;display:flex;align-items:center;gap:10px;}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

/* ─── FILTER BAR ─── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-btn{font-size:11px;font-weight:600;padding:6px 16px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;color:var(--ink2);cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s;}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.filter-btn:hover:not(.active){background:var(--border);border-color:var(--border2);}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .kpi-top{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
  .kpi-text-wrap{grid-column:1/-1;}
}
@media(max-width:600px){
  .hdr{padding:0 16px;}
  .main{padding:16px 12px 40px;}
  .kpi-top{grid-template-columns:1fr;}
}

/* ─── TOOLTIP ─── */
.tooltip-wrap{position:relative;display:inline-block;}
.tooltip-wrap .tip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:4px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:99;}
.tooltip-wrap:hover .tip{opacity:1;}

/* ─── ANIMATE ─── */
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.comment-item{animation:slideIn .2s ease;}
</style>
</head>

/* ═══════════════════════════════════════════
   STATE (localStorage persistence)
═══════════════════════════════════════════ */
function loadState(){
  try{return JSON.parse(localStorage.getItem('people_q2_state')||'{}');}catch{return {};}
}
function saveState(s){
  try{localStorage.setItem('people_q2_state',JSON.stringify(s));}catch{}
}

let STATE = loadState();

function getProgress(kpiId){
  return STATE[kpiId+'_prog'] ?? 0;
}
function setProgress(kpiId, val){
  STATE[kpiId+'_prog'] = val;
  saveState(STATE);
}
function getComments(kpiId){
  return STATE[kpiId+'_comments'] ?? [];
}
function addComment(kpiId, author, mes, text){
  const cs = getComments(kpiId);
  cs.push({id: Date.now(), author, mes, text, date: new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})});
  STATE[kpiId+'_comments'] = cs;
  saveState(STATE);
}
function deleteComment(kpiId, cid){
  STATE[kpiId+'_comments'] = getComments(kpiId).filter(c=>c.id!==cid);
  saveState(STATE);
}
function getFiles(kpiId){
  return STATE[kpiId+'_files'] ?? [];
}
function addFile(kpiId, name, size){
  const fs = getFiles(kpiId);
  fs.push({id:Date.now(), name, size, date: new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short'})});
  STATE[kpiId+'_files'] = fs;
  saveState(STATE);
}
function deleteFile(kpiId, fid){
  STATE[kpiId+'_files'] = getFiles(kpiId).filter(f=>f.id!==fid);
  saveState(STATE);
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function statusClass(s){
  if(s==='CONSEGUIDO') return 'st-conseguido';
  if(s==='EN PROCESO') return 'st-proceso';
  if(s==='NO CONSEGUIDO') return 'st-no';
  return 'st-iniciar';
}
function statusLabel(s){
  if(s==='CONSEGUIDO') return '✓ Conseguido';
  if(s==='EN PROCESO') return '◐ En proceso';
  if(s==='NO CONSEGUIDO') return '✗ No conseguido';
  return '○ Sin iniciar';
}
function progColor(p){
  if(p>=80) return '#16A34A';
  if(p>=40) return '#D97706';
  if(p>0) return '#5B4CFF';
  return '#C8C8D4';
}
function fileIcon(name){
  const ext = name.split('.').pop().toLowerCase();
  if(['pdf'].includes(ext)) return '📄';
  if(['xlsx','xls','csv'].includes(ext)) return '📊';
  if(['pptx','ppt'].includes(ext)) return '📑';
  if(['docx','doc'].includes(ext)) return '📝';
  if(['png','jpg','jpeg','gif','webp'].includes(ext)) return '🖼️';
  if(['zip','rar'].includes(ext)) return '📦';
  return '📎';
}
function fmtSize(bytes){
  if(bytes < 1024) return bytes+'B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}

/* ═══════════════════════════════════════════
   OVERVIEW STATS
═══════════════════════════════════════════ */
function calcOverview(){
  let totalKPIs=0, conseguido=0, enProceso=0, sinIniciar=0, totalProg=0;
  ROCKS.forEach(r=>r.kpis.forEach(k=>{
    totalKPIs++;
    // April period = index 0
    const aprilSt = k.periodos[0].estado;
    if(aprilSt==='CONSEGUIDO') conseguido++;
    else if(aprilSt==='EN PROCESO') enProceso++;
    else sinIniciar++;
    totalProg += getProgress(k.id);
  }));
  return {totalKPIs, conseguido, enProceso, sinIniciar, avgProg: totalKPIs>0? Math.round(totalProg/totalKPIs) : 0};
}

/* ═══════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════ */
function toggleRock(id){
  const body = document.getElementById('body_'+id);
  const chev = document.getElementById('chev_'+id);
  const desc = document.getElementById('desc_'+id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
  if(desc) desc.classList.toggle('expanded', !isOpen);
  STATE['rock_'+id+'_open'] = !isOpen;
  saveState(STATE);
}

function updateProg(kpiId, val){
  val = parseInt(val);
  setProgress(kpiId, val);
  const fill = document.getElementById('fill_'+kpiId);
  const pct = document.getElementById('pct_'+kpiId);
  const col = progColor(val);
  if(fill){ fill.style.width=val+'%'; fill.style.background=col; }
  if(pct){ pct.textContent=val+'%'; pct.style.color=col; }
}

function submitComment(kpiId){
  const auth = document.getElementById('auth_'+kpiId)?.value.trim() || 'Equipo People';
  const mes = document.getElementById('mes_'+kpiId)?.value || 'Mayo 2026';
  const txt = document.getElementById('cinput_'+kpiId)?.value.trim();
  if(!txt) return;
  addComment(kpiId, auth, mes, txt);
  const list = document.getElementById('comments_'+kpiId);
  const cs = getComments(kpiId);
  const c = cs[cs.length-1];
  const div = document.createElement('div');
  div.className='comment-item';
  div.id='ci_'+c.id;
  div.innerHTML=`
    <div class="comment-header">
      <span class="comment-author">${c.author}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="comment-date">${c.date}</span>
        <button class="btn-del" onclick="delComment('${kpiId}',${c.id})" title="Eliminar">✕</button>
      </div>
    </div>
    <span class="comment-month">${c.mes}</span>
    <div class="comment-text">${c.text}</div>`;
  list.appendChild(div);
  document.getElementById('cinput_'+kpiId).value='';
  // update count badge
  const title = list.previousElementSibling;
  const allComments = getComments(kpiId);
  let badge = title.querySelector('span');
  if(!badge){ badge=document.createElement('span'); title.appendChild(badge); }
  badge.textContent=allComments.length;
}

function delComment(kpiId, cid){
  deleteComment(kpiId, cid);
  const el = document.getElementById('ci_'+cid);
  if(el) el.remove();
}

function handleFileUpload(kpiId, input){
  const files = Array.from(input.files);
  files.forEach(f=>{
    addFile(kpiId, f.name, fmtSize(f.size));
    const list = document.getElementById('files_'+kpiId);
    const fs = getFiles(kpiId);
    const file = fs[fs.length-1];
    const chip = document.createElement('div');
    chip.className='file-chip';
    chip.id='fc_'+file.id;
    chip.innerHTML=`
      <span class="file-chip-icon">${fileIcon(file.name)}</span>
      <div>
        <div class="file-chip-name" title="${file.name}">${file.name}</div>
        <div class="file-chip-date">${file.date} · ${file.size}</div>
      </div>
      <button class="btn-file-del" onclick="delFile('${kpiId}',${file.id})" title="Quitar">✕</button>`;
    list.appendChild(chip);
  });
  input.value='';
}

function delFile(kpiId, fid){
  deleteFile(kpiId, fid);
  const el = document.getElementById('fc_'+fid);
  if(el) el.remove();
}
